description: Driver for InfyPower ACDC power supply. Currently supports BEG1K075G
  with only one module and group dial set to 0.
config:
  can_device:
    description: CAN interface name
    type: string
    default: can0
  controller_address:
    description: >-
      Address of the controller module. In most cases you do not need to change this.
      Must be between 0xF0 and 0xF8 (in decimal: 240-248).
    type: integer
    default: 240
  group_address:
    description: >-
      Group address/dial setting. Use this if your PSUs using automatic allocation of the addresses.
      If you have multiple PSUs, set this number in accordance with the group dial
      setting of the PSUs you want to use. Check the PSU manual for details but
      the DIAL is sometimes in format 8421 (left MSB and right LSB).
      Must be between 0x00 and 0x3E (in decimal: 0-62).
    type: integer
    default: 0
provides:
  main:
    description: Main interface
    interface: power_supply_DC
    config: {}
